[project]
name = "jevfetch"
version = "0.1.0"
description = "A web-reading tool for LLM agents that returns the parts of a page relevant to a question, verbatim"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Deukwoong Woo", email = "deukwoong.woo@a2sys.ai" }]
keywords = ["llm", "agents", "web", "retrieval", "context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "tiktoken>=0.14.0",
]

[project.urls]
Repository = "https://github.com/a2sys-ai/jevfetch"

[project.scripts]
jevfetch = "jevfetch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevfetch"]
exclude = ["**/.claude/**"]

[tool.hatch.build.targets.sdist]
exclude = ["**/.claude/**", "/bench", "/tests/test_bench.py", "/tests/test_bench_agents.py", "/.github"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"bench/agents/rubric_body.py" = ["E501"]  # regex table copied from the research repository

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14",
]
